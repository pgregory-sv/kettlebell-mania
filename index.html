<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KB Timer">
<meta name="mobile-web-app-capable" content="yes">
<title>Kettlebell Timer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: #f4f3ef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1a18;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 14px; text-align: center; letter-spacing: 0.01em; }
  select, input[type="text"], button {
    font-family: inherit;
    font-size: 15px;
    border: 1px solid #d8d6cd;
    border-radius: 8px;
    background: #ffffff;
    color: #1a1a18;
    padding: 8px 10px;
    height: 40px;
  }
  select, input[type="text"] { width: 100%; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .series-col { width: 120px; flex: none; }
  .card {
    border: 1px solid #e5e3da;
    border-radius: 14px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 14px;
    background: #ffffff;
    transition: background 0.4s ease;
  }
  #phaseLabel { font-size: 13px; color: #6b6a63; margin: 0 0 10px; letter-spacing: 0.02em; min-height: 16px; }
  #exLabel { font-size: 28px; font-weight: 600; margin: 0 0 14px; line-height: 1.2; transition: color 0.4s ease; }
  #clock { font-size: 56px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }
  #repCue { font-size: 16px; font-weight: 600; color: #185fa5; margin: 10px 0 0; min-height: 22px; }
  .dots { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 14px; min-height: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8d6cd; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow button { flex: 1; font-weight: 600; }
  .btnrow button:disabled { opacity: 0.45; }
  label.field { display: block; font-size: 12px; color: #6b6a63; margin: 0 0 4px 2px; }
  .hidden { display: none; }
  .note { font-size: 12px; color: #6b6a63; margin: -4px 2px 12px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Kettlebell Timer</h1>

  <div class="row">
    <div style="flex:1;">
      <label class="field">Workout</label>
      <select id="workout">
        <option value="qd">Quick and Dead</option>
        <option value="ss">Simple and Sinister</option>
      </select>
    </div>
  </div>

  <!-- Quick and Dead options -->
  <div id="qdOptions">
    <div class="row">
      <div style="flex:1;">
        <label class="field">Protocol</label>
        <select id="protocol">
          <option value="54">5:4 protocol (5 reps x4)</option>
          <option value="102">10:2 protocol (10 reps x2)</option>
        </select>
      </div>
      <div class="series-col">
        <label class="field">Series</label>
        <select id="series">
          <option value="2">2 series</option>
          <option value="3">3 series</option>
          <option value="4">4 series</option>
          <option value="5" selected>5 series</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div style="flex:1;">
        <label class="field">Exercise 1</label>
        <input id="ex1" type="text" value="Kettlebell snatch">
      </div>
      <div style="flex:1;">
        <label class="field">Exercise 2</label>
        <input id="ex2" type="text" value="Power pushup">
      </div>
    </div>
  </div>

  <!-- Simple and Sinister options -->
  <div id="ssOptions" class="hidden">
    <div class="row">
      <div style="flex:1;">
        <label class="field">Swing interval (10 sets of 10 swings)</label>
        <select id="ssInterval">
          <option value="60">EMOM (every 60 s)</option>
          <option value="45">Every 45 s</option>
          <option value="30">Every 30 s</option>
        </select>
      </div>
    </div>
    <p class="note">Then a 1 min rest, followed by 10 Turkish get-ups EMOM (alternating right / left).</p>
  </div>

  <div class="card" id="card">
    <p id="phaseLabel"></p>
    <p id="exLabel">Set your options and press start</p>
    <p id="clock">00:00</p>
    <p id="repCue"></p>
  </div>

  <div class="dots" id="seriesDots"></div>

  <div class="btnrow">
    <button id="startBtn">Start</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="resetBtn">Reset</button>
  </div>

</div>

<script>
/* ---------- Audio ---------- */
let audioCtx = null;
function ensureCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, vol, type, delay){
  try{
    const ctx = ensureCtx();
    const startAt = ctx.currentTime + (delay||0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = freq;
    o.type = type || 'sine';
    g.gain.value = vol;
    o.connect(g); g.connect(ctx.destination);
    o.start(startAt);
    g.gain.setValueAtTime(vol, startAt);
    g.gain.exponentialRampToValueAtTime(0.001, startAt + dur);
    o.stop(startAt + dur);
  }catch(e){}
}
function warningTick(){ tone(1500, 0.06, 0.06, 'sine'); }
function exerciseHorn(){
  tone(392, 0.22, 0.28, 'square', 0);
  tone(523, 0.28, 0.28, 'square', 0.22);
}
function transitionBeep(){ tone(500, 0.3, 0.18, 'sine'); }

/* ---------- Colors ---------- */
const GREEN_BG = '#dcefdd';
const GREEN_ACCENT = '#1f6b2f';
const AMBER_BG = '#fbecc7';
const AMBER_ACCENT = '#8a5a00';
const NEUTRAL_BG = '#ffffff';
const NEUTRAL_ACCENT = '#1a1a18';

/* ---------- State ---------- */
let phases = [];
let phaseIdx = 0;
let phaseStart = 0;
let phaseElapsedAtPause = 0;
let running = false;
let rafId = null;
let firedMarks = new Set();
let firedWarnings = new Set();
let wakeLock = null;

/* ---------- Elements ---------- */
const workoutEl = document.getElementById('workout');
const qdOptions = document.getElementById('qdOptions');
const ssOptions = document.getElementById('ssOptions');
const protocolEl = document.getElementById('protocol');
const seriesEl = document.getElementById('series');
const ex1El = document.getElementById('ex1');
const ex2El = document.getElementById('ex2');
const ssIntervalEl = document.getElementById('ssInterval');
const card = document.getElementById('card');
const phaseLabel = document.getElementById('phaseLabel');
const exLabel = document.getElementById('exLabel');
const clockEl = document.getElementById('clock');
const repCue = document.getElementById('repCue');
const seriesDots = document.getElementById('seriesDots');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const controls = [workoutEl, protocolEl, seriesEl, ex1El, ex2El, ssIntervalEl];

/* ---------- Saved settings ---------- */
const STORE_KEY = 'kettlebell-timer-settings';
function saveSettings(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      workout: workoutEl.value, protocol: protocolEl.value, series: seriesEl.value,
      ex1: ex1El.value, ex2: ex2El.value, ssInterval: ssIntervalEl.value
    }));
  }catch(e){}
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.workout) workoutEl.value = s.workout;
    if(s.protocol) protocolEl.value = s.protocol;
    if(s.series) seriesEl.value = s.series;
    if(typeof s.ex1 === 'string') ex1El.value = s.ex1;
    if(typeof s.ex2 === 'string') ex2El.value = s.ex2;
    if(s.ssInterval) ssIntervalEl.value = s.ssInterval;
  }catch(e){}
}
function showWorkoutOptions(){
  const isSS = workoutEl.value === 'ss';
  qdOptions.classList.toggle('hidden', isSS);
  ssOptions.classList.toggle('hidden', !isSS);
}
controls.forEach(el => el.addEventListener('change', ()=>{ showWorkoutOptions(); saveSettings(); }));
[ex1El, ex2El].forEach(el => el.addEventListener('input', saveSettings));

/* ---------- Screen wake lock ---------- */
async function getWake(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && running) getWake();
});

/* ---------- Helpers ---------- */
function fmt(s){
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

/* ---------- Workout builders ---------- */
function buildQuickAndDead(){
  const proto = protocolEl.value;
  const n = parseInt(seriesEl.value,10);
  const marks = proto === '54' ? [0,30,60,90] : [0,60];
  const reps = proto === '54' ? 5 : 10;
  const cue = 'Go: ' + reps + ' reps';
  const list = [];
  for(let s=1;s<=n;s++){
    const label = 'Series '+s+' of '+n;
    list.push({type:'exercise', label, exName:ex1El.value||'Exercise 1', dur:120, marks, cue, warnMarks:true, lead:0});
    list.push({type:'rest', label, exName:'Rest, transition', dur:60, marks:[], lead:5});
    list.push({type:'exercise', label, exName:ex2El.value||'Exercise 2', dur:120, marks, cue, warnMarks:true, lead:0, dotEnd:true});
    if(s < n){
      list.push({type:'rest', label, exName:'Rest before next series', dur:60, marks:[], lead:5});
    }
  }
  list.push({type:'done', label:'Complete', exName:'Workout finished', dur:0, marks:[]});
  return list;
}

function buildSimpleAndSinister(){
  const interval = parseInt(ssIntervalEl.value,10);
  const list = [];
  for(let i=1;i<=10;i++){
    list.push({type:'exercise', label:'Swing set '+i+' of 10', exName:'Kettlebell swing', dur:interval, marks:[0], cue:'Go: 10 swings', cuePersist:true, lead:3, dotEnd:true});
  }
  list.push({type:'rest', label:'Transition', exName:'Rest, get-ups next', dur:60, marks:[], lead:5});
  for(let i=1;i<=10;i++){
    const side = (i % 2 === 1) ? 'right' : 'left';
    list.push({type:'exercise', label:'Get-up '+i+' of 10', exName:'Turkish get-up, '+side, dur:60, marks:[0], cue:'Go: 1 get-up ('+side+')', cuePersist:true, lead:3, dotEnd:true});
  }
  list.push({type:'done', label:'Complete', exName:'Workout finished', dur:0, marks:[]});
  return list;
}

function buildPhases(){
  return workoutEl.value === 'ss' ? buildSimpleAndSinister() : buildQuickAndDead();
}

/* ---------- Dots ---------- */
function renderDots(){
  const count = phases.filter(p => p.dotEnd).length;
  seriesDots.innerHTML = '';
  for(let i=0;i<count;i++){
    const dot = document.createElement('span');
    dot.className = 'dot';
    seriesDots.appendChild(dot);
  }
}
function updateDots(){
  let completed = 0;
  for(let i=0;i<phaseIdx;i++){ if(phases[i].dotEnd) completed++; }
  const dots = seriesDots.children;
  for(let i=0;i<dots.length;i++){
    dots[i].style.background = i < completed ? '#185fa5' : '#d8d6cd';
  }
}

/* ---------- UI ---------- */
function applyPhaseColors(p){
  if(!p || p.type === 'done'){
    card.style.background = NEUTRAL_BG;
    exLabel.style.color = NEUTRAL_ACCENT;
    return;
  }
  if(p.type === 'exercise'){
    card.style.background = GREEN_BG;
    exLabel.style.color = GREEN_ACCENT;
  } else {
    card.style.background = AMBER_BG;
    exLabel.style.color = AMBER_ACCENT;
  }
}

function setPhaseUI(){
  const p = phases[phaseIdx];
  if(!p) return;
  if(p.type==='done'){
    phaseLabel.textContent = 'Complete';
    exLabel.textContent = 'Workout finished, nice work';
    applyPhaseColors(p);
    clockEl.textContent = '00:00';
    repCue.textContent = '';
    return;
  }
  phaseLabel.textContent = p.label + (p.type==='rest' ? ' (rest)' : '');
  exLabel.textContent = p.exName;
  applyPhaseColors(p);
  repCue.textContent = '';
}

/* ---------- Timer loop ---------- */
function tick(){
  if(!running) return;
  const p = phases[phaseIdx];
  if(!p || p.type==='done'){
    finishAll();
    return;
  }
  const elapsed = (performance.now() - phaseStart)/1000 + phaseElapsedAtPause;
  const remaining = p.dur - elapsed;
  clockEl.textContent = fmt(remaining);

  // Soft ticks just before the next exercise phase starts
  const nextPhase = phases[phaseIdx+1];
  if(nextPhase && nextPhase.type === 'exercise' && p.lead && remaining <= p.lead + 0.05){
    const secLeft = Math.ceil(remaining);
    const key = 'trans-'+secLeft;
    if(secLeft >= 1 && secLeft <= p.lead && !firedWarnings.has(key)){
      firedWarnings.add(key);
      warningTick();
    }
  }

  // Soft tick 3 seconds before each rep mark inside a Quick and Dead block
  if(p.type === 'exercise' && p.warnMarks){
    p.marks.forEach(m=>{
      if(m === 0) return;
      const key = 'mark-'+m;
      if(elapsed >= m - 3 && elapsed < m && !firedWarnings.has(key)){
        firedWarnings.add(key);
        warningTick();
      }
    });
  }

  // Rep cues
  p.marks.forEach(m=>{
    const key = phaseIdx+'-'+m;
    if(elapsed >= m && !firedMarks.has(key)){
      firedMarks.add(key);
      if(m !== 0){
        tone(880, 0.15, 0.15, 'sine');
      }
      repCue.textContent = p.cue || '';
      if(!p.cuePersist){
        setTimeout(()=>{ if(phases[phaseIdx]===p) repCue.textContent=''; }, 1500);
      }
    }
  });

  if(remaining <= 0){
    advancePhase();
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function advancePhase(){
  phaseIdx++;
  phaseElapsedAtPause = 0;
  phaseStart = performance.now();
  firedMarks = new Set();
  firedWarnings = new Set();
  const p = phases[phaseIdx];
  if(p && p.type === 'exercise'){
    exerciseHorn();
  } else if(p && p.type !== 'done'){
    transitionBeep();
  }
  updateDots();
  setPhaseUI();
  if(p && p.type==='done'){
    finishAll();
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function finishAll(){
  running = false;
  releaseWake();
  phaseLabel.textContent = 'Complete';
  exLabel.textContent = 'Workout finished, nice work';
  applyPhaseColors({type:'done'});
  clockEl.textContent = '00:00';
  repCue.textContent = '';
  startBtn.disabled = false;
  startBtn.textContent = 'Start';
  pauseBtn.disabled = true;
  controls.forEach(el => el.disabled = false);
  updateDots();
}

/* ---------- Buttons ---------- */
startBtn.addEventListener('click', ()=>{
  ensureCtx();
  if(phases.length===0 || (phases[phaseIdx] && phases[phaseIdx].type==='done')){
    phases = buildPhases();
    phaseIdx = 0;
    phaseElapsedAtPause = 0;
    firedMarks = new Set();
    firedWarnings = new Set();
    renderDots();
    updateDots();
    setPhaseUI();
    exerciseHorn();
  }
  running = true;
  phaseStart = performance.now();
  startBtn.disabled = true;
  pauseBtn.disabled = false;
  controls.forEach(el => el.disabled = true);
  getWake();
  rafId = requestAnimationFrame(tick);
});

pauseBtn.addEventListener('click', ()=>{
  if(!running) return;
  running = false;
  phaseElapsedAtPause += (performance.now() - phaseStart)/1000;
  cancelAnimationFrame(rafId);
  releaseWake();
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  startBtn.textContent = 'Resume';
});

resetBtn.addEventListener('click', ()=>{
  running = false;
  cancelAnimationFrame(rafId);
  releaseWake();
  phases = [];
  phaseIdx = 0;
  phaseElapsedAtPause = 0;
  firedMarks = new Set();
  firedWarnings = new Set();
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  startBtn.textContent = 'Start';
  controls.forEach(el => el.disabled = false);
  phaseLabel.textContent = '';
  exLabel.textContent = 'Set your options and press start';
  applyPhaseColors(null);
  clockEl.textContent = '00:00';
  repCue.textContent = '';
  seriesDots.innerHTML = '';
});

/* ---------- Init ---------- */
loadSettings();
showWorkoutOptions();
</script>
</body>
</html>
